name = "movement-decoded-calendar"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# D1 database binding — create the database first:
#   wrangler d1 create movement_decoded_db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "movement_decoded_db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# ANTHROPIC_API_KEY is a secret, not set here.
# Set it with:
#   wrangler pages secret put ANTHROPIC_API_KEY
#
# Optional: override the model used for idea generation / build-out
# (defaults to claude-sonnet-5 if unset). Set as a secret or plain var:
#   wrangler pages secret put ANTHROPIC_MODEL
