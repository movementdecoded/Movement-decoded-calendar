name = "movement-decoded-calendar"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

# D1 binding must live here, not just in the dashboard. Because
# pages_build_output_dir is set above, this file puts the project into
# Wrangler-config mode, and in that mode Cloudflare treats this file as
# authoritative for Pages Functions bindings — a dashboard-only binding is
# silently ignored at runtime, which is what caused `env.DB` to be
# undefined ("Cannot read properties of undefined (reading 'prepare')")
# even though Settings -> Functions showed DB bound correctly. (A previous
# version of this block had a literal placeholder database_id, which is a
# separate bug that broke every deploy at the publish step with "Invalid
# database UUID" — this is the real ID, copied from the D1 database's own
# "Copy binding" action.)
[[d1_databases]]
binding = "DB"
database_name = "movement_decoded_db"
database_id = "7a916bb1-aeaf-44c8-a97f-bfa89f047783"

# ANTHROPIC_API_KEY is a secret, not set here.
# Set it with:
#   wrangler pages secret put ANTHROPIC_API_KEY
#
# Optional: override the model used for idea generation / build-out
# (defaults to claude-sonnet-5 if unset). Set as a secret or plain var:
#   wrangler pages secret put ANTHROPIC_MODEL
